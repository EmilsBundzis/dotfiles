format = """
[┌──](bold #ff003c)$directory$git_branch
[└─>](bold #fcee09) """

[character]
success_symbol = "[⚡](bold #fcee09)"
error_symbol = "[ERR](bold #ff003c)"

[directory]
style = "bold #fcee09"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = "󰘬 "
style = "bold #00f6ff"
format = "on [$symbol$branch]($style) "
